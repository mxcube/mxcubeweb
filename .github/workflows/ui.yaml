---
# yamllint disable rule:line-length

name: UI

"on":
  pull_request: null
  merge_group: null
  push:
    branches:
      - develop
      - master
  workflow_dispatch: null

# Cancel outdated runs of the same pull request, but never runs on branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: JS-Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js, pnpm and UI dependencies
        uses: ./.github/actions/setup_ui

      - name: Run Prettier
        run: pnpm --dir ui prettier

  lint:
    name: JS-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js, pnpm and UI dependencies
        uses: ./.github/actions/setup_ui

      - name: Run ESLint
        # fail on warnings
        run: pnpm --dir ui eslint --max-warnings=0

  lint-tsc:
    name: JS-Lint-TSC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js, pnpm and UI dependencies
        uses: ./.github/actions/setup_ui

      - name: Run tsc
        run: pnpm --dir ui lint:tsc

  e2e:
    name: E2E-Test
    runs-on: ubuntu-latest

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The E2E tests need the full server environment (Conda + Poetry),
      # which also provides Node.js and pnpm.
      - name: Install MXCuBE
        uses: ./.github/actions/install_server

      - name: Install UI dependencies
        run: "${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui install --frozen-lockfile"

      - name: Build UI
        run: "${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui build"

      - name: Start MXCuBE-Web server (XML config)
        run: |
          poetry run mxcubeweb-server -r ./demo/ --static-folder $(pwd)/ui/build/ -L debug &
          ${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui exec wait-on http://127.0.0.1:8081
          ${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui e2e
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8081

      - name: Start MXCuBE-Web server (YAML config)
        run: |
          pkill -f mxcubeweb-server || true
          poetry run mxcubeweb-server -r ./demo.yaml/ --static-folder $(pwd)/ui/build/ -L debug &
          ${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui exec wait-on http://127.0.0.1:8081
          ${MAMBA_EXE} run --name mxcubeweb pnpm --dir ui e2e
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8081

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: debug
          retention-days: 3
          path: |
            ui/cypress/debug
            debug

  sync-lockfile:
    name: Sync pnpm-lock.yaml for Snyk PRs
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[Snyk]')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup_ui
        with:
          install-dependencies: "false"

      - name: Update pnpm-lock.yaml
        run: pnpm --dir ui install --lockfile-only

      - name: Commit changes (if lockfile updated)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/pnpm-lock.yaml
          if ! git diff --quiet --staged; then
            git commit -m "CI: update pnpm-lock.yaml"
            git push
          fi
