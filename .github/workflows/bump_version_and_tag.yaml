---

name: Create/Update Tag

"on":
  push:
    branches:
      - develop

# Never run two releases at the same time
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in sync with `pyproject.toml` and `.pre-commit-config.yaml`
  POETRY_VERSION: "2.5.1"

jobs:
  create-version-tag:
    runs-on: ubuntu-latest

    # The `pypi` environment must match the "Trusted Publisher" configured on PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/mxcubeweb

    permissions:
      contents: write  # push the version bump commit and the tag
      id-token: write  # PyPI Trusted Publishing (no API token needed)

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_TOKEN }}

      # Building does not need the project's dependencies,
      # only a Python version allowed by `requires-python`.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install --python python3.11 "poetry==${{ env.POETRY_VERSION }}"

      - name: Update version
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          poetry version minor
          git config --global user.name "${BOT_NAME}"
          git config --global user.email "${BOT_EMAIL}"
          git add pyproject.toml
          git commit -m "[skip ci] Bumped minor version"
          git push

      - name: Build package
        run: poetry build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create or update tag
        run: |
          TAG="v$(poetry version --short)"
          git tag --force "${TAG}"
          git push --force origin "refs/tags/${TAG}"
