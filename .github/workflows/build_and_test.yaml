---
name: Python build and test

"on":
  pull_request: null
  merge_group: null
  push:
    branches:
      - develop
      - master
  workflow_dispatch: null

# Cancel outdated runs of the same pull request, but never runs on branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All hooks run in their own isolated environments managed by pre-commit,
      # so neither Conda nor the project's dependencies are needed here.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: >-
          pipx run --spec "pre-commit>=4.1,<5"
          pre-commit run --all-files --show-diff-on-failure

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MXCuBE server for ${{ matrix.python-version }}
        uses: ./.github/actions/install_server
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with pytest
        run: poetry run pytest
