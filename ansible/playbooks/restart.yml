---
# Playbook to restart all MXCubeWeb and BLISS services

- name: Restart all services
  hosts: mxcube_vms
  become: true

  tasks:
    # ------------------------------------------------------------------
    # Stop everything in reverse dependency order
    # ------------------------------------------------------------------
    - name: Stop MXCubeWeb
      ansible.builtin.systemd:
        name: "mxcubeweb-{{ vm_context }}"
        state: stopped
      ignore_errors: true

    - name: Stop BLISS REST service
      ansible.builtin.systemd:
        name: "bliss-rest-{{ vm_context }}"
        state: stopped
      ignore_errors: true

    - name: Stop BLISS demo servers
      ansible.builtin.systemd:
        name: "bliss-demo-servers-{{ vm_context }}"
        state: stopped
      ignore_errors: true

    - name: Wait for services to stop
      ansible.builtin.wait_for:
        timeout: 5

    # ------------------------------------------------------------------
    # Kill stale BLISS processes not managed by systemd (e.g. tmux-based
    # bliss shell sessions started before the systemd services were set up).
    # These orphan processes hold port 5000 and prevent bliss-rest from
    # binding at startup. This can happen after a first-time deploy or
    # after a manual "bliss -s demo_session" invocation.
    # ------------------------------------------------------------------
    - name: Kill stale BLISS shell sessions
      ansible.builtin.shell: pkill -f "bliss.shell.main" || true
      ignore_errors: true

    - name: Kill any remaining process holding port 5000
      ansible.builtin.shell: fuser -k 5000/tcp || true
      ignore_errors: true

    - name: Wait for port 5000 to be released
      ansible.builtin.wait_for:
        host: localhost
        port: 5000
        state: absent
        timeout: 15
      ignore_errors: true

    # ------------------------------------------------------------------
    # Start in dependency order: demo-servers → rest → mxcubeweb
    # ------------------------------------------------------------------
    - name: Start BLISS demo servers
      ansible.builtin.systemd:
        name: "bliss-demo-servers-{{ vm_context }}"
        state: started
        daemon_reload: true

    - name: Wait for demo servers to be ready (10s)
      ansible.builtin.wait_for:
        timeout: 10

    - name: Start BLISS REST service
      ansible.builtin.systemd:
        name: "bliss-rest-{{ vm_context }}"
        state: started
        daemon_reload: true

    - name: Wait for BLISS REST API to be ready on port 5000
      ansible.builtin.wait_for:
        host: localhost
        port: 5000
        timeout: 60

    - name: Start MXCubeWeb
      ansible.builtin.systemd:
        name: "mxcubeweb-{{ vm_context }}"
        state: started
        daemon_reload: true

    - name: Wait for MXCubeWeb to be ready on port 8081
      ansible.builtin.wait_for:
        host: localhost
        port: 8081
        timeout: 120

    # ------------------------------------------------------------------
    # Status report
    # ------------------------------------------------------------------
    - name: Get status of all services
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: service_statuses
      loop:
        - "bliss-demo-servers-{{ vm_context }}"
        - "bliss-rest-{{ vm_context }}"
        - "mxcubeweb-{{ vm_context }}"

    - name: Show service statuses
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.status.ActiveState }}"
      loop: "{{ service_statuses.results }}"

    - name: Show log commands
      ansible.builtin.debug:
        msg:
          - "BLISS demo servers : journalctl -u bliss-demo-servers-{{ vm_context }} -f"
          - "BLISS REST         : journalctl -u bliss-rest-{{ vm_context }} -f"
          - "MXCubeWeb          : journalctl -u mxcubeweb-{{ vm_context }} -f"
